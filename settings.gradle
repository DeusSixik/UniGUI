pluginManagement {
    repositories {
        maven { url "https://maven.kikugie.dev/releases" }
        maven { url "https://maven.kikugie.dev/snapshots" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.7.11'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'unigui'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        versions '1.20.1', '1.21.1', '26.1.2', '26.2', '26.3'
        vcsVersion = '1.20.1'
    }
}

include 'core'
project(':core').projectDir = file('core')
include 'demo'
project(':demo').projectDir = file('demo')
include 'editor'
project(':editor').projectDir = file('editor')

/** Forge 26.1+ собирается ForgeGradle 7, а не Architectury Loom. */
static boolean usesForgeGradle(String minecraftVersion, String moduleName) {
    return moduleName == 'forge' && (minecraftVersion.tokenize('.')[0] as int) >= 26
}

def modulesByMinecraftVersion = [
        '1.20.1': ['common', 'fabric', 'forge', 'TestMod', 'ISF'],
        '1.21.1': ['common', 'fabric', 'forge', 'neoforge', 'TestMod'],
        // 26.1+ не обфусцирован: Fabric и NeoForge собирает Architectury Loom (no-remap),
        // Forge — ForgeGradle 7 (Loom не поддерживает Forge без обфускации).
        '26.1.2': ['common', 'fabric', 'neoforge', 'forge'],
        '26.2': ['common', 'fabric', 'neoforge', 'forge'],
        '26.3': ['common', 'fabric', 'neoforge', 'forge']
]

modulesByMinecraftVersion.each { minecraftVersion, modules ->
    modules.each { moduleName ->
        def modulePath = ":${minecraftVersion}:${moduleName}"
        include modulePath
        project(modulePath).projectDir = file(moduleName)
        project(modulePath).buildFileName = usesForgeGradle(minecraftVersion, moduleName) ? 'build-fg7.gradle' : 'build.gradle'
    }
}
