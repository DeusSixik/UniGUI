plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.2'
}

group = rootProject.findProperty('maven_group') ?: 'dev.sixik'
version = rootProject.findProperty('mod_version') ?: 'unspecified'

repositories {
    mavenCentral()
}

base {
    archivesName = "${rootProject.findProperty('archives_name') ?: 'unigui'}-core"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
}

configurations {
    include {
        canBeResolved = true
        canBeConsumed = false
    }
    implementation.extendsFrom(include)
}

dependencies {
    // Minecraft 1.12+ supplies fastutil; compile against the oldest API baseline without packaging it in core.
    compileOnly 'it.unimi.dsi:fastutil:7.1.0'
    include 'org.jetbrains:annotations:26.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'it.unimi.dsi:fastutil:7.1.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// XML/XAML behaviour tests load the real demo documents that ship with the common module.
sourceSets {
    test {
        resources {
            srcDir rootProject.file('common/src/main/resources')
            // Only the documents: common's META-INF/services entries reference Minecraft-only classes.
            include 'assets/unigui/xml/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs << "-parameters"
}

tasks.named('jar', Jar).configure {
    from {
        configurations.include.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}

// Профайлер gc выводит alloc.rate.norm: байты на операцию подтверждают отсутствие лишних аллокаций.
jmh {
    profilers = ['gc']
}
