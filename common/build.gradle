architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"


    compileOnly("com.github.somehussar:yoga:1.0.1-java8")
    compileOnly("dev.vfyjxf:taffy:1.1.4")
}

tasks.register("layoutV3SelfTest", JavaExec) {
    group = "verification"
    description = "Runs Layout V3 self-test assertions."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.sixik.unigui.tests.LayoutV3SelfTest"
}

tasks.register("windowManagerSelfTest", JavaExec) {
    group = "verification"
    description = "Runs window manager self-test assertions."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.sixik.unigui.tests.WindowManagerSelfTest"
}

tasks.register("dockingModelSelfTest", JavaExec) {
    group = "verification"
    description = "Runs docking model self-test assertions."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.sixik.unigui.tests.DockingModelSelfTest"
}

tasks.register("dockingInteractionSelfTest", JavaExec) {
    group = "verification"
    description = "Runs docking interaction self-test assertions."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.sixik.unigui.tests.DockingInteractionSelfTest"
}

tasks.named("test") {
    dependsOn tasks.named("layoutV3SelfTest")
    dependsOn tasks.named("windowManagerSelfTest")
    dependsOn tasks.named("dockingModelSelfTest")
    dependsOn tasks.named("dockingInteractionSelfTest")
}
