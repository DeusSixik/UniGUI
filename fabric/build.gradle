plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${versionProject.fabric_loader_version}"


    common(project(path: "${versionProject.path}:common", configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: "${versionProject.path}:common", configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'fabric_loader', versionProject.fabric_loader_version
    inputs.property 'minecraft', versionProject.fabric_minecraft_dependency
    inputs.property 'java', versionProject.java_version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                fabric_loader: versionProject.fabric_loader_version,
                minecraft: versionProject.fabric_minecraft_dependency,
                java: versionProject.java_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
