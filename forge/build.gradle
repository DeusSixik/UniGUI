plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "unigui.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${versionProject.forge_version}"


    common(commonNamed("${versionProject.path}:common")) { transitive false }
    common(project(path: ':core')) { transitive false }
    // demo и editor нужны и в dev-запуске, а не только в итоговом jar (shadowBundle).
    common(project(path: ':editor')) { transitive false }
    common(project(path: ':demo')) { transitive false }
    shadowBundle(project(path: ':core')) { transitive false }
    shadowBundle(project(path: ':editor')) { transitive false }
    shadowBundle(project(path: ':demo')) { transitive false }
    shadowBundle project(path: "${versionProject.path}:common", configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

if (unobfuscated) {
    // Итоговый jar без классификатора занимает shadowJar.
    jar {
        archiveClassifier = 'raw'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Без обфускации shadowJar и есть итоговый jar; иначе его дальше ремапит remapJar.
    archiveClassifier = unobfuscated ? '' : 'dev-shadow'
}

if (!unobfuscated) {
    remapJar {
        input.set shadowJar.archiveFile
    }
}
