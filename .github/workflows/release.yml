name: Build and Release

on:
  push:
  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/Main_other' }}


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect release
        id: version
        shell: bash
        run: |
          get_version() { grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r[:space:]'; }

          NEW=$(get_version)
          if [ -z "$NEW" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          OLD=""
          if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            OLD=$(git show "$BEFORE:gradle.properties" 2>/dev/null | grep -E '^mod_version=' | head -n1 | cut -d= -f2- | tr -d '\r[:space:]' || true)
          fi

          echo "old=$OLD new=$NEW ref=${{ github.ref }}"

          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/Main_other" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$OLD" != "$NEW" ]; then
              RELEASE=true
            fi
          fi

          if [ "$RELEASE" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists, skipping release"
            RELEASE=false
          fi

          PRE=false
          if [[ "$NEW" =~ (alpha|beta|rc|snapshot|pre) ]]; then PRE=true; fi

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          # Stonecutter writes jars to build/stonecutter/<mc>/<module>/libs.
          # Java 17 for 1.20.1 is fetched by the foojay toolchain resolver.
          ./gradlew \
            :1.20.1:fabric:build \
            :1.20.1:forge:build \
            :1.21.1:fabric:build \
            :1.21.1:forge:build \
            :1.21.1:neoforge:build \
            --no-daemon


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unigui-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/stonecutter/*/fabric/libs/*.jar
            build/stonecutter/*/forge/libs/*.jar
            build/stonecutter/*/neoforge/libs/*.jar
          retention-days: 14


      - name: Collect release jars
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p release-files
          shopt -s nullglob
          for f in \
              build/stonecutter/*/fabric/libs/*.jar \
              build/stonecutter/*/forge/libs/*.jar \
              build/stonecutter/*/neoforge/libs/*.jar
          do
            case "$f" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar|*-all.jar) continue ;;
            esac
            cp "$f" release-files/
          done
          count=$(find release-files -name '*.jar' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No release jars collected" >&2
            exit 1
          fi
          ls -l release-files


      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: UniGUI ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: release-files/*.jar
          fail_on_unmatched_files: true
