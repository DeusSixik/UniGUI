name: Build and Release

on:
  push:
  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Detect release
        id: version
        shell: bash
        run: |
          get_version() { grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r[:space:]'; }

          NEW=$(get_version)
          if [ -z "$NEW" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          OLD=""
          if [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            OLD=$(git show "$BEFORE:gradle.properties" 2>/dev/null | grep -E '^mod_version=' | head -n1 | cut -d= -f2- | tr -d '\r[:space:]' || true)
          fi

          echo "old=$OLD new=$NEW ref=${{ github.ref }}"

          # Release only on main, and only when mod_version actually changed.
          # A manual run or a push without a version diff never publishes a tag.
          RELEASE=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
            RELEASE=true
          fi

          if [ "$RELEASE" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists, skipping release"
            RELEASE=false
          fi

          PRE=false
          if [[ "$NEW" =~ (alpha|beta|rc|snapshot|pre) ]]; then PRE=true; fi

          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"


      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          # Stonecutter writes jars to build/stonecutter/<mc>/<module>/libs.
          # Java 17 for 1.20.1 is fetched by the foojay toolchain resolver.
          ./gradlew \
            :core:jar \
            :editor:jar \
            :demo:jar \
            :1.20.1:fabric:build \
            :1.20.1:forge:build \
            :1.21.1:fabric:build \
            :1.21.1:forge:build \
            :1.21.1:neoforge:build \
            --no-daemon


      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25


      - name: Build Cleanroom 1.12.2
        shell: bash
        run: |
          chmod +x 1.12.2-cleanroom/gradlew
          cd 1.12.2-cleanroom
          ./gradlew build --no-daemon


      - name: Build GTNH 1.7.10
        shell: bash
        run: |
          chmod +x 1.7.10-gtnh/gradlew
          cd 1.7.10-gtnh
          ./gradlew build --no-daemon


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unigui-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/stonecutter/*/fabric/libs/*.jar
            build/stonecutter/*/forge/libs/*.jar
            build/stonecutter/*/neoforge/libs/*.jar
            1.12.2-cleanroom/build/libs/unigui-cleanroom-1.12.2-${{ steps.version.outputs.version }}.jar
            1.7.10-gtnh/build/libs/unigui-gtnh-1.7.10-${{ steps.version.outputs.version }}.jar
          retention-days: 14


      - name: Collect release jars
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p release-files
          shopt -s nullglob
          mkdir -p \
            release-files/forge-1.20.1 \
            release-files/fabric-1.20.1 \
            release-files/forge-1.21.1 \
            release-files/fabric-1.21.1 \
            release-files/neoforge-1.21.1 \
            release-files/cleanroom \
            release-files/gtnh

          copy_modern_jar() {
            local source=$1 destination=$2
            local jars=()
            for f in "$source"/*.jar; do
              case "$f" in
                *-sources.jar|*-dev.jar|*-dev-shadow.jar|*-all.jar) continue ;;
              esac
              jars+=("$f")
            done
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "Expected exactly one release jar in $source, found ${#jars[@]}" >&2
              exit 1
            fi
            cp "${jars[0]}" "$destination/"
          }

          copy_modern_jar build/stonecutter/1.20.1/forge/libs release-files/forge-1.20.1
          copy_modern_jar build/stonecutter/1.20.1/fabric/libs release-files/fabric-1.20.1
          copy_modern_jar build/stonecutter/1.21.1/forge/libs release-files/forge-1.21.1
          copy_modern_jar build/stonecutter/1.21.1/fabric/libs release-files/fabric-1.21.1
          copy_modern_jar build/stonecutter/1.21.1/neoforge/libs release-files/neoforge-1.21.1
          cp "1.12.2-cleanroom/build/libs/unigui-cleanroom-1.12.2-${{ steps.version.outputs.version }}.jar" release-files/cleanroom/
          cp "1.7.10-gtnh/build/libs/unigui-gtnh-1.7.10-${{ steps.version.outputs.version }}.jar" release-files/gtnh/
          count=$(find release-files -name '*.jar' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No release jars collected" >&2
            exit 1
          fi
          ls -l release-files


      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: UniGUI ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: release-files/**/*.jar
          fail_on_unmatched_files: true


      - name: Publish Forge 1.20.1 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-files/forge-1.20.1/*.jar
          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.20.1 (Forge)
          curseforge-version: ${{ steps.version.outputs.version }}-forge-1.20.1
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: forge
          curseforge-game-versions: 1.20.1

      - name: Publish Fabric 1.20.1 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-files/fabric-1.20.1/*.jar
          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.20.1 (Fabric)
          curseforge-version: ${{ steps.version.outputs.version }}-fabric-1.20.1
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: fabric
          curseforge-game-versions: 1.20.1

      - name: Publish Forge 1.21.1 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-files/forge-1.21.1/*.jar
          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (Forge)
          curseforge-version: ${{ steps.version.outputs.version }}-forge-1.21.1
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: forge
          curseforge-game-versions: 1.21.1

      - name: Publish Fabric 1.21.1 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-files/fabric-1.21.1/*.jar
          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (Fabric)
          curseforge-version: ${{ steps.version.outputs.version }}-fabric-1.21.1
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: fabric
          curseforge-game-versions: 1.21.1

      - name: Publish NeoForge 1.21.1 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release-files/neoforge-1.21.1/*.jar
          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (NeoForge)
          curseforge-version: ${{ steps.version.outputs.version }}-neoforge-1.21.1
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: neoforge
          curseforge-game-versions: 1.21.1


      - name: Publish Cleanroom 1.12.2 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: release-files/cleanroom/*.jar

          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.12.2 (Cleanroom)
          curseforge-version: ${{ steps.version.outputs.version }}-cleanroom-1.12.2
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: forge
          curseforge-game-versions: 1.12.2


      - name: Publish GTNH 1.7.10 to CurseForge
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: release-files/gtnh/*.jar

          curseforge-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.7.10 (GTNH)
          curseforge-version: ${{ steps.version.outputs.version }}-gtnh-1.7.10
          curseforge-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          curseforge-loaders: forge
          curseforge-game-versions: 1.7.10
          curseforge-dependencies: |
            998880(required)


      - name: Publish Forge 1.20.1 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-files/forge-1.20.1/*.jar
          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.20.1 (Forge)
          modrinth-version: ${{ steps.version.outputs.version }}-forge-1.20.1
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: forge
          modrinth-game-versions: 1.20.1

      - name: Publish Fabric 1.20.1 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-files/fabric-1.20.1/*.jar
          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.20.1 (Fabric)
          modrinth-version: ${{ steps.version.outputs.version }}-fabric-1.20.1
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: fabric
          modrinth-game-versions: 1.20.1

      - name: Publish Forge 1.21.1 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-files/forge-1.21.1/*.jar
          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (Forge)
          modrinth-version: ${{ steps.version.outputs.version }}-forge-1.21.1
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: forge
          modrinth-game-versions: 1.21.1

      - name: Publish Fabric 1.21.1 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-files/fabric-1.21.1/*.jar
          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (Fabric)
          modrinth-version: ${{ steps.version.outputs.version }}-fabric-1.21.1
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: fabric
          modrinth-game-versions: 1.21.1

      - name: Publish NeoForge 1.21.1 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-files/neoforge-1.21.1/*.jar
          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.21.1 (NeoForge)
          modrinth-version: ${{ steps.version.outputs.version }}-neoforge-1.21.1
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: neoforge
          modrinth-game-versions: 1.21.1


      - name: Publish Cleanroom 1.12.2 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: release-files/cleanroom/*.jar

          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.12.2 (Cleanroom)
          modrinth-version: ${{ steps.version.outputs.version }}-cleanroom-1.12.2
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: forge
          modrinth-game-versions: 1.12.2


      - name: Publish GTNH 1.7.10 to Modrinth
        if: steps.version.outputs.release == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: release-files/gtnh/*.jar

          modrinth-name: UniGUI ${{ steps.version.outputs.version }} for Minecraft 1.7.10 (GTNH)
          modrinth-version: ${{ steps.version.outputs.version }}-gtnh-1.7.10
          modrinth-version-type: ${{ steps.version.outputs.prerelease == 'true' && 'beta' || 'release' }}
          modrinth-loaders: forge
          modrinth-game-versions: 1.7.10
          modrinth-dependencies: |
            eC4lt4Oy(required)
