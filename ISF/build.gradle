loom {
    forge {
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

base {
    archivesName = "isf-forge-${versionProject.minecraft_version}"
}

version = versionProject.findProperty('isf_version') ?: '0.1.0'

// Исходники в UTF-8 (кириллица в JavaDoc): без этого javadoc падает
// с unmappable character на дефолтной windows-1251.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    uniguiCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom uniguiCommon
    runtimeClasspath.extendsFrom uniguiCommon
    developmentForge.extendsFrom uniguiCommon

    uniguiForge {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom uniguiForge
    runtimeClasspath.extendsFrom uniguiForge
    // NOTE: do NOT extend developmentForge — Architectury Transformer already injects
    // unigui-forge-dev.jar at runtime; adding it again causes split package in JPMS
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + configurations.uniguiCommon
        runtimeClasspath += sourceSets.main.output + configurations.uniguiCommon
    }
}

dependencies {
    forge "net.minecraftforge:forge:${versionProject.forge_version}"

    uniguiCommon(project(path: "${versionProject.path}:common", configuration: 'namedElements')) {
        transitive false
    }
    uniguiForge(project(path: "${versionProject.path}:forge", configuration: 'namedElements')) {
        transitive false
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'forge_loader_range', versionProject.forge_loader_version_range
    inputs.property 'minecraft_range', versionProject.forge_minecraft_version_range

    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                forge_loader_range: versionProject.forge_loader_version_range,
                minecraft_range: versionProject.forge_minecraft_version_range
    }
}

