plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'me.champeau.jmh' version '0.7.3' apply false
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
}

def versionProject = project
def versionProperty = { String key ->
    // mod_version is owned by the repository root gradle.properties.
    // Stonecutter swaps the Gradle project for each Minecraft profile, so a copy
    // inside versions/<mc>/gradle.properties would shadow the root value.
    if (key == 'mod_version') {
        return rootProject.findProperty(key)
    }
    def value = versionProject.findProperty(key)
    return value != null ? value : rootProject.findProperty(key)
}


// Начиная с 26.1 Minecraft поставляется без обфускации: маппинги и remapJar не нужны,
// а Architectury Loom подключается как `loom-no-remap`.
def unobfuscated = (versionProperty('minecraft_version').tokenize('.')[0] as int) >= 26

architectury {
    minecraft = versionProperty('minecraft_version')
}

allprojects {
    group = versionProperty('maven_group')
    version = versionProperty('mod_version')

    layout.buildDirectory = rootProject.layout.buildDirectory.dir(
            "stonecutter/${project.path.substring(1).replace(':', '/')}"
    )

    repositories {
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("https://maven.neoforged.net/releases/") }
    }
}

// Architectury Loom copies one transformer agent to the root .gradle directory during IDE sync.
// Stonecutter's versioned projects share that destination, so serialize only their sync tasks.
gradle.projectsEvaluated {
    // Только ленивые ссылки: реализация всех задач (toList) заставляет Loom резолвить конфигурации
    // вне эксклюзивной блокировки, что Gradle 9 запрещает.
    def ideaSyncTasks = allprojects.findAll { candidate -> candidate.tasks.names.contains('ideaSyncTask') }
            .collect { candidate -> candidate.tasks.named('ideaSyncTask') }
    ideaSyncTasks.eachWithIndex { task, index ->
        if (index > 0) {
            def previous = ideaSyncTasks[index - 1]
            task.configure { it.mustRunAfter(previous) }
        }
    }
}

subprojects {
    def minecraftIndependent = project.name in ['core', 'demo']
    // Forge 26.1+ собирает ForgeGradle 7 (forge/build-fg7.gradle): Loom и общие для Loom настройки к нему не применяются.
    def forgeGradle = unobfuscated && project.name == 'forge'
    ext.versionProject = versionProject
    ext.versionProperty = versionProperty
    ext.unobfuscated = unobfuscated
    if (forgeGradle) return
    if (minecraftIndependent) {
        apply plugin: 'java-library'
    } else {
        apply plugin: unobfuscated ? 'dev.architectury.loom-no-remap' : 'dev.architectury.loom'
        apply plugin: 'architectury-plugin'
    }
    apply plugin: 'maven-publish'

    ext.versionProject = versionProject
    ext.versionProperty = versionProperty
    ext.unobfuscated = unobfuscated
    // Конфигурации зависимостей-модов: без обфускации Loom их не ремапит, поэтому это обычные implementation/compileOnly.
    ext.modImplementationConfig = unobfuscated ? 'implementation' : 'modImplementation'
    ext.modCompileOnlyConfig = unobfuscated ? 'compileOnly' : 'modCompileOnly'
    // Common-модуль для платформ: в обфусцированных версиях нужен вариант с named-маппингами.
    ext.commonNamed = { String path ->
        unobfuscated
                ? project.dependencies.project(path: path)
                : project.dependencies.project(path: path, configuration: 'namedElements')
    }

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "${versionProperty('archives_name')}-$project.name-${versionProperty('minecraft_version')}"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        if (!minecraftIndependent) {
            minecraft "net.minecraft:minecraft:${versionProperty('minecraft_version')}"
            if (!unobfuscated) {
                mappings loom.officialMojangMappings()
            }
        }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        def javaVersion = minecraftIndependent
                ? JavaVersion.VERSION_17
                : JavaVersion.toVersion(versionProperty('java_version') ?: '17')

        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion

        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion.majorVersion as int)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = (versionProperty('java_version') ?: '17') as int
        options.compilerArgs << "-parameters"
    }

    if (!minecraftIndependent) {
        if (!unobfuscated) {
            tasks.withType(net.fabricmc.loom.task.launch.GenerateRemapClasspathTask).configureEach {
                remapClasspathFile.set(layout.buildDirectory.file('loom-cache/remapClasspath.txt'))
            }
        }

        tasks.withType(net.fabricmc.loom.task.launch.GenerateLog4jConfigTask).configureEach {
            outputFile.set(layout.buildDirectory.file('loom-cache/log4j.xml'))
        }

        tasks.withType(net.fabricmc.loom.task.launch.GenerateDLIConfigTask).configureEach {
            if (!unobfuscated) {
                dependsOn tasks.named('generateRemapClasspath')
                remapClasspathFile.set(layout.buildDirectory.file('loom-cache/remapClasspath.txt'))
            }
            if (hasProperty('devLauncherConfig')) {
                devLauncherConfig.set(layout.buildDirectory.file('loom-cache/launch.cfg'))
            }
            // generateLog4jConfig пишет в build/.../loom-cache/log4j.xml (см. выше); без этого launch.cfg ссылается
            // на несуществующий файл по умолчанию, и в dev-запуске логируются только ERROR.
            // Геттер protected: hasProperty его не видит, но Groovy может его вызвать.
            getLog4jConfigPaths().set(layout.buildDirectory.file('loom-cache/log4j.xml').get().asFile.absolutePath)
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
