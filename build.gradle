plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def versionProject = project
def versionProperty = { String key ->
    def value = versionProject.findProperty(key)
    return value != null ? value : rootProject.findProperty(key)
}



architectury {
    minecraft = versionProperty('minecraft_version')
}

allprojects {
    group = versionProperty('maven_group')
    version = versionProperty('mod_version')

    layout.buildDirectory = rootProject.layout.buildDirectory.dir(
            "stonecutter/${project.path.substring(1).replace(':', '/')}"
    )

    repositories {
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        maven { url = uri("https://maven.neoforged.net/releases/") }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    ext.versionProject = versionProject
    ext.versionProperty = versionProperty

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "${versionProperty('archives_name')}-$project.name-${versionProperty('minecraft_version')}"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${versionProperty('minecraft_version')}"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        def javaVersion = JavaVersion.toVersion(versionProperty('java_version') ?: '17')

        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion

        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion.majorVersion as int)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = (versionProperty('java_version') ?: '17') as int
    }

    tasks.withType(net.fabricmc.loom.task.launch.GenerateRemapClasspathTask).configureEach {
        remapClasspathFile.set(layout.buildDirectory.file('loom-cache/remapClasspath.txt'))
    }

    tasks.withType(net.fabricmc.loom.task.launch.GenerateLog4jConfigTask).configureEach {
        outputFile.set(layout.buildDirectory.file('loom-cache/log4j.xml'))
    }

    tasks.withType(net.fabricmc.loom.task.launch.GenerateDLIConfigTask).configureEach {
        dependsOn tasks.named('generateRemapClasspath')
        remapClasspathFile.set(layout.buildDirectory.file('loom-cache/remapClasspath.txt'))
        if (hasProperty('devLauncherConfig')) {
            devLauncherConfig.set(layout.buildDirectory.file('loom-cache/launch.cfg'))
        }
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
