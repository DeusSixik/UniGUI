plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    main {
        resources.srcDir "src/main/resources-${versionProject.minecraft_version}"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge versionProject.neoforge_dependency

    common(commonNamed("${versionProject.path}:common")) { transitive false }
    common(project(path: ':core')) { transitive false }
    // demo и editor нужны и в dev-запуске, а не только в итоговом jar (shadowBundle).
    common(project(path: ':editor')) { transitive false }
    common(project(path: ':demo')) { transitive false }
    shadowBundle(project(path: ':core')) { transitive false }
    shadowBundle(project(path: ':editor')) { transitive false }
    shadowBundle(project(path: ':demo')) { transitive false }
    shadowBundle project(path: "${versionProject.path}:common", configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'neoforge_loader_version_range', versionProject.neoforge_loader_version_range
    inputs.property 'neoforge_version_range', versionProject.neoforge_version_range
    inputs.property 'minecraft_version_range', versionProject.neoforge_minecraft_version_range

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand version: project.version,
                neoforge_loader_version_range: versionProject.neoforge_loader_version_range,
                neoforge_version_range: versionProject.neoforge_version_range,
                minecraft_version_range: versionProject.neoforge_minecraft_version_range
    }
}

if (unobfuscated) {
    // Итоговый jar без классификатора занимает shadowJar.
    jar {
        archiveClassifier = 'raw'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Без обфускации shadowJar и есть итоговый jar; иначе его дальше ремапит remapJar.
    archiveClassifier = unobfuscated ? '' : 'dev-shadow'
}

if (!unobfuscated) {
    remapJar {
        input.set shadowJar.archiveFile
    }
}
